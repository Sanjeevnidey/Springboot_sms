
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            padding: 24px;
            margin-bottom: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 6px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1e3a8a;
        }

        tr:hover {
            background: #f8fafc;
        }

        .actions {
            white-space: nowrap;
        }

        a, button {
            display: inline-block;
            padding: 9px 12px;
            margin: 2px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .view {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .edit {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .add-button {
            background: #2563eb;
            color: white;
            padding: 11px 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 6px;
        }

        .empty {
            padding: 20px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 10px;
            }

            .card {
                padding: 16px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Management System</h1>
    <p class="subtitle">Manage student records in one place.</p>

    <div class="card">
        <h2>Student List</h2>

        <p class="message"
           th:if="${message}"
           th:text="${message}"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>

                    <td class="actions">
                        <a class="view"
                           th:href="@{/students/{id}(id=${student.id})}">
                            View
                        </a>

                        <a class="edit"
                           th:href="@{/students/edit/{id}(id=${student.id})}">
                            Edit
                        </a>

                        <form
                            th:action="@{/students/delete/{id}(id=${student.id})}"
                            method="post"
                            style="display:inline"
                            onsubmit="return confirm('Are you sure you want to delete this student?');">

                            <button class="delete" type="submit">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="4" class="empty">
                        No students found. Add your first student below!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>Add New Student</h2>

        <form th:action="@{/students}"
              th:object="${student}"
              method="post">

            <div class="form-group">
                <label for="name">Name</label>
                <input id="name"
                       type="text"
                       th:field="*{name}"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email"
                       type="email"
                       th:field="*{email}"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <button class="add-button" type="submit">
                Add Student
            </button>
        </form>
    </div>

</div>
</body>
</html>
