
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .card {
            max-width: 600px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .detail {
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .label {
            display: inline-block;
            width: 80px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Student Details</h1>

        <div class="detail">
            <span class="label">ID:</span>
            <span th:text="${student.id}"></span>
        </div>

        <div class="detail">
            <span class="label">Name:</span>
            <span th:text="${student.name}"></span>
        </div>

        <div class="detail">
            <span class="label">Email:</span>
            <span th:text="${student.email}"></span>
        </div>

        <a th:href="@{/students}">Back to Students</a>
    </div>
</body>
</html>
